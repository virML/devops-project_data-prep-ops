global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: dataprepops-api
    static_configs:
      - targets: ['127.0.0.1:8082']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
