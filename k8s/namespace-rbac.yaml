apiVersion: v1
kind: Namespace
metadata:
  name: dataprepops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dataprepops-frontend
  namespace: dataprepops
automountServiceAccountToken: false
---
# For the viva, this role can list Pods but cannot read Kubernetes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-read-only
  namespace: dataprepops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-pod-observer
  namespace: dataprepops
subjects:
  - kind: ServiceAccount
    name: dataprepops-frontend
    namespace: dataprepops
roleRef:
  kind: Role
  name: pod-read-only
  apiGroup: rbac.authorization.k8s.io
