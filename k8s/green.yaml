apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: dataprepops
  name: dataprepops-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: dataprepops-ui, color: green}
  template:
    metadata:
      labels: {app: dataprepops-ui, color: green}
    spec:
      serviceAccountName: dataprepops-frontend
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: dataprepops-frontend:__BUILD_TAG__
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 1
            periodSeconds: 5
